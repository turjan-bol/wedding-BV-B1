<script>
    /* Script básico para inicializar cuenta regresiva si el plugin no carga */
    document.addEventListener('DOMContentLoaded', function() {
        const countDownDate = new Date("Mar 01, 2026 17:00:00").getTime();
        const interval = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            
            if (distance < 0) {
                clearInterval(interval);
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            
            // Actualiza los elementos si existen
            const daysEl = document.querySelector('.eael-countdown-days .eael-countdown-digits');
            const hoursEl = document.querySelector('.eael-countdown-hours .eael-countdown-digits');
            const minEl = document.querySelector('.eael-countdown-minutes .eael-countdown-digits');
            
            if(daysEl) daysEl.innerText = days;
            if(hoursEl) hoursEl.innerText = hours;
            if(minEl) minEl.innerText = minutes;
        }, 1000);
    });
</script>
